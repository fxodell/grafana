<!DOCTYPE html>
<html lang="[[.User.Language]]">

<head>
  [[ if and .CSPEnabled .IsDevelopmentEnv ]]
  <!-- Cypress overwrites CSP headers in HTTP requests, so this is required for e2e tests-->
  <meta http-equiv="Content-Security-Policy" content="[[.CSPContent]]" />
  [[ end ]]
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width" />
  <meta name="theme-color" content="#000" />

  <!-- Override link-preview thumbnails -->
  <meta property="og:title" content="NFM" />
  <meta property="og:description" content="itsaenergy.com" />
  <meta property="og:image" content="" />

  <!-- <title>[[.AppTitle]]</title> -->
  <title>NFM</title>

  <base href="[[.AppSubUrl]]/" />

  <link rel="icon" type="image/png" href="[[.FavIcon]]" />
  <link rel="apple-touch-icon" sizes="180x180" href="[[.AppleTouchIcon]]" />
  <link rel="mask-icon" href="[[.ContentDeliveryURL]]public/img/grafana_mask_icon.svg" color="#F05A28" />

  <!-- If theme is "system", we inject the stylesheets with javascript further down the page -->
  [[ if eq .ThemeType "light" ]]
  <link rel="stylesheet" href="[[.ContentDeliveryURL]][[.Assets.CSSLight]]" />
  [[ else if eq .ThemeType "dark" ]]
  <link rel="stylesheet" href="[[.ContentDeliveryURL]][[.Assets.CSSDark]]" />
  [[ end ]]

  <script nonce="[[.Nonce]]">
    performance.mark('frontend_boot_css_time_seconds');
  </script>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="msapplication-TileColor" content="#2b5797" />
  <meta name="msapplication-config" content="public/img/browserconfig.xml" />
</head>

<body class="theme-[[ .ThemeType ]] [[.AppNameBodyClass]]">
  <style>
    .preloader {
      height: 100%;
      flex-direction: column;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .preloader__enter {
      /* ... unchanged ... */
    }

    .preloader__bounce {
      /* ... unchanged ... */
    }

    .preloader__logo {
      /* ... unchanged ... */
    }

    .preloader__text {
      /* ... unchanged ... */
    }

    /* (rest of preloader CSS unchanged) */
  </style>

  <div class="preloader">
    <!-- (preloader markup unchanged) -->
  </div>

  <div id="reactRoot"></div>

  <script nonce="[[.Nonce]]">
    window.grafanaBootData = {
      user: [[.User]],
      settings: [[.Settings]],
      navTree: [[.NavTree]],
      themePaths: {
        light: '[[.ContentDeliveryURL]][[.Assets.CSSLight]]',
        dark: '[[.ContentDeliveryURL]][[.Assets.CSSDark]]'
      }
    };
    /* (theme-load and compatibility JS unchanged) */
  </script>

  [[if .GoogleTagManagerId]]
  <!-- Google Tag Manager (unchanged) -->
  [[end]]

  [[range $asset := .Assets.JSFiles]]
  <script nonce="[[$.Nonce]]" src="[[$.ContentDeliveryURL]][[$asset.FilePath]]" type="text/javascript"></script>
  [[end]]

  <script nonce="[[.Nonce]]">
    performance.mark('frontend_boot_js_done_time_seconds');
  </script>
</body>

</html>
